{% extends 'base.html' %}

{% block title %}Список товаров{% endblock %}

{% block body %}
  <div class="products-container">
    <h1>Список продуктов</h1>
    {% if products %}
      <div class="products-grid">
        {% for product in products %}
          <div class="product-card">
            <a href="/web/products/{{ product.id }}" class="product-link">
              {{ product.name }}
            </a>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="no-products-message">Товаров пока нет.</p>
    {% endif %}
  </div>
{% endblock %}
